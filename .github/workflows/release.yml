name: Build and Release Firmware

# The git tag is the single source of truth for the version.
# Pushing a tag patches version.json and FIRMWARE_VERSION automatically,
# compiles both binaries, commits the version bump to main, and publishes
# a GitHub Release — no manual file edits needed.
#
# Usage:
#   git tag v0.4.2 && git push origin v0.4.2
on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create releases and push back to main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Derive version from tag; patch source files ───────────────────────
      - name: Patch version files from tag
        id: version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "version=$TAG_VER" >> "$GITHUB_OUTPUT"

          # Patch version.json
          printf '{\n  "version": "%s"\n}\n' "$TAG_VER" > version.json

          # Patch #define FIRMWARE_VERSION in the sketch
          sed -i \
            "s/#define FIRMWARE_VERSION \"[^\"]*\"/#define FIRMWARE_VERSION \"$TAG_VER\"/" \
            SEM_Time2LastStart.ino

          echo "Patched to v$TAG_VER"
          grep "FIRMWARE_VERSION" SEM_Time2LastStart.ino
          cat version.json

      # ── Toolchain ─────────────────────────────────────────────────────────
      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino data
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: arduino-esp32-${{ runner.os }}-

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "ezTime"
          arduino-cli lib install "ElegantOTA"
          arduino-cli lib install "RTClib"
          arduino-cli lib install "Adafruit BusIO"

      # ── Compile ───────────────────────────────────────────────────────────
      # arduino-cli requires the sketch directory name to match the .ino file.
      # partitions.csv in the sketch folder overrides PartitionScheme=default,
      # giving 1536 KB per OTA slot (vs 1280 KB) with 960 KB for LittleFS.
      - name: Stage sketch directory
        run: |
          mkdir -p SEM_Time2LastStart
          cp SEM_Time2LastStart.ino SEM_Time2LastStart/
          cp partitions.csv SEM_Time2LastStart/
          cp -r src SEM_Time2LastStart/   # DMD32 vendored driver

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=custom \
            --output-dir build \
            SEM_Time2LastStart

      # ── Package ───────────────────────────────────────────────────────────
      - name: Rename firmware binary
        run: cp build/SEM_Time2LastStart.ino.bin firmware.bin

      - name: Build LittleFS image
        run: |
          MKLITTLEFS=$(find ~/.arduino15/packages/esp32/tools/mklittlefs \
                            -name mklittlefs -type f | sort -V | tail -1)
          echo "Using: $MKLITTLEFS"
          # LittleFS partition size from partitions.csv: 0xF0000 = 983040 bytes
          "$MKLITTLEFS" -c data -s 983040 -b 4096 -p 256 littlefs.bin

      # ── Commit version bump back to main ──────────────────────────────────
      # This keeps version.json on main current so the device OTA check works.
      - name: Commit version bump to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json SEM_Time2LastStart.ino
          git diff --staged --quiet || \
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:refs/heads/main

      # ── Release ───────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body: |
            ## SEM Race Clock ${{ github.ref_name }}

            **Install via the web UI** — open the Device card at `http://raceclock.local`,
            expand it, and use **Check for updates → Update firmware** and/or **Update web files**.

            **Manual install** — flash `firmware.bin` and/or `littlefs.bin` via
            [ElegantOTA](http://raceclock.local/update) (username: `admin`, password: `raceclock`).
          files: |
            firmware.bin
            littlefs.bin
          fail_on_unmatched_files: true
